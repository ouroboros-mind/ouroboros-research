<title id="t">EXP-0044 lineage progression</title>
<desc id="d">Dumbbell chart. On 600 held-out territory tasks (base model 340 passes), lineage A rose from 486 to 535 (+8.2 points), lineage B from 521 to 562 (+6.8), lineage C from 489 to 528 (+6.5). Gains of the accepted candidate over the current root: round 1 +15, +15, +8; round 2 +7, +4, +9.</desc>
