<text x="40" y="448" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a9bbb5" text-anchor="start" font-weight="400" >G0 and G2 were scored on the same 600 tasks in the same session. G1 was not scored on the final test. Each round's check used different</text>
<text x="40" y="468" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a9bbb5" text-anchor="start" font-weight="400" >held-out tasks, so round gains are shown separately rather than chained into one curve. One-sided exact McNemar p (G2 vs G0): 2.8e-6,</text>
<text x="40" y="488" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a9bbb5" text-anchor="start" font-weight="400" >1.9e-5, 2.6e-6. Measured forgetting stayed below 0.01 (nonzero) for every accepted candidate. Two difficulty levels dipped inside the gains.</text>
<text x="40" y="508" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a9bbb5" text-anchor="start" font-weight="400" >No ungated control was run, so the cause of the gain is not identified. Transfer outside the territory was not measured.</text>
