<rect x="60" y="372" width="140" height="40" rx="8" fill="#1c2925" stroke="#2c3b36" stroke-width="1.5"/>
<text x="130.0" y="397" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e6efec" text-anchor="middle" font-weight="400" >System-1 (fast choices)</text>
<rect x="212" y="372" width="140" height="40" rx="8" fill="#1c2925" stroke="#2c3b36" stroke-width="1.5"/>
<text x="282.0" y="397" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e6efec" text-anchor="middle" font-weight="400" >Experience Bus</text>
<rect x="760" y="200" width="220" height="230" rx="10" fill="#17211e" stroke="#2c3b36" stroke-width="1.5"/>
<text x="780" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6efec" text-anchor="start" font-weight="600" >Learning and growth</text>
<text x="780" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a9bbb5" text-anchor="start" font-weight="400" >Turns verified experience</text>
<text x="780" y="270" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a9bbb5" text-anchor="start" font-weight="400" >into cheaper forms:</text>
<text x="780" y="296" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6efec" text-anchor="start" font-weight="400" >memory</text>
<text x="780" y="316" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6efec" text-anchor="start" font-weight="400" >procedures and skills</text>
<text x="780" y="336" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6efec" text-anchor="start" font-weight="400" >neural adapters</text>
<text x="780" y="362" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a9bbb5" text-anchor="start" font-weight="400" >Nothing is kept unless</text>
<text x="780" y="380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a9bbb5" text-anchor="start" font-weight="400" >the evaluation plane</text>
<text x="780" y="398" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a9bbb5" text-anchor="start" font-weight="400" >accepts it.</text>
