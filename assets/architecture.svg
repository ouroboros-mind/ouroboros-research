<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="640" viewBox="0 0 1020 640" role="img" aria-labelledby="t d">
<title id="t">Ouroboros conceptual architecture</title>
<desc id="d">A persistent Cognitive Kernel holds identity, memory, world model, self-model, competency map, workspace, System-1 and the Experience Bus. It reaches replaceable language models through the Mind ABI. A learning plane turns verified experience into memory, skills and adapters, and a protected evaluation plane outside the mind decides what is kept.</desc>
<rect width="1020" height="640" rx="14" fill="#111816"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#73877f"/></marker></defs>
<text x="40" y="44" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e6efec" text-anchor="start" font-weight="600" >Ouroboros: conceptual architecture</text>
<text x="40" y="68" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a9bbb5" text-anchor="start" font-weight="400" >The mind is durable. The cortex is replaceable.</text>
<rect x="40" y="92" width="940" height="70" rx="10" fill="#132723" stroke="#1d5c51" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="60" y="120" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6efec" text-anchor="start" font-weight="600" >Protected evaluation plane</text>
<text x="60" y="144" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a9bbb5" text-anchor="start" font-weight="400" >Designed to be outside the mind's reach: held-out checks, regression and forgetting checks, rollback.</text>
<rect x="40" y="200" width="640" height="230" rx="10" fill="#17211e" stroke="#2fb59a" stroke-width="1.5"/>
<text x="60" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#e6efec" text-anchor="start" font-weight="600" >Persistent mind: the Cognitive Kernel</text>
<text x="60" y="250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a9bbb5" text-anchor="start" font-weight="400" >Owned by the individual. Designed to survive a change of model.</text>
<rect x="60" y="268" width="140" height="40" rx="8" fill="#1c2925" stroke="#2c3b36" stroke-width="1.5"/>
<text x="130.0" y="293" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e6efec" text-anchor="middle" font-weight="400" >Identity and lineage</text>
<rect x="212" y="268" width="140" height="40" rx="8" fill="#1c2925" stroke="#2c3b36" stroke-width="1.5"/>
<text x="282.0" y="293" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e6efec" text-anchor="middle" font-weight="400" >Autobiographical memory</text>
<rect x="364" y="268" width="140" height="40" rx="8" fill="#1c2925" stroke="#2c3b36" stroke-width="1.5"/>
<text x="434.0" y="293" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e6efec" text-anchor="middle" font-weight="400" >Semantic memory</text>
<rect x="516" y="268" width="140" height="40" rx="8" fill="#1c2925" stroke="#2c3b36" stroke-width="1.5"/>
<text x="586.0" y="293" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e6efec" text-anchor="middle" font-weight="400" >Procedures and skills</text>
<rect x="60" y="320" width="140" height="40" rx="8" fill="#1c2925" stroke="#2c3b36" stroke-width="1.5"/>
