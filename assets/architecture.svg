<line x1="870" y1="200" x2="870" y2="164" stroke="#73877f" stroke-width="2" marker-end="url(#ah)"/><text x="878" y="186" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a9bbb5" text-anchor="start" font-weight="400" >candidates</text>
<rect x="40" y="456" width="640" height="44" rx="8" fill="#1a2b27" stroke="#2fb59a" stroke-width="1.5"/>
