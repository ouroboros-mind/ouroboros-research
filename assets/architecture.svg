<text x="600" y="576" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bbb5" text-anchor="middle" font-weight="400" >research only</text>
<text x="700" y="556" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6efec" text-anchor="start" font-weight="600" >Replaceable cortex</text>
<text x="700" y="578" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a9bbb5" text-anchor="start" font-weight="400" >The language model does the</text>
<text x="700" y="595" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a9bbb5" text-anchor="start" font-weight="400" >reasoning; the mind provides</text>
<text x="700" y="612" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a9bbb5" text-anchor="start" font-weight="400" >continuity across upgrades.</text>
